<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="form-header">
      <h1>문의하기</h1>
      <p>궁금하신 점을 남겨주시면 빠르게 답변드리겠습니다.</p>
    </header>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="field">
        <label for="name">이름 <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="홍길동" autocomplete="name" required>
        <p class="error" id="name-error"></p>
      </div>

      <div class="field">
        <label for="email">이메일 <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" required>
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="phone">전화번호 <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" autocomplete="tel" inputmode="numeric" maxlength="13" required>
        <p class="error" id="phone-error"></p>
      </div>

      <div class="field">
        <label for="message">문의내용 <span class="required">*</span></label>
        <textarea id="message" name="message" rows="6" placeholder="문의하실 내용을 입력해주세요." maxlength="1000" required></textarea>
        <div class="field-footer">
          <p class="error" id="message-error"></p>
          <span class="counter"><span id="message-count">0</span> / 1000</span>
        </div>
      </div>

      <button type="submit" class="submit-btn">문의 보내기</button>
      <p class="success" id="form-success" role="status" hidden>문의가 접수되었습니다. 감사합니다!</p>
      <p class="error form-error" id="form-error" role="alert" hidden></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
